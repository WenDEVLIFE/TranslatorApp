name: mandtrans_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  http: ^1.2.2
  firebase_data_connect: ^0.1.2+1
  speech_to_text: any
  permission_handler: ^10.2.0
  fluttertoast: any
  sqflite: ^2.0.0+4
  path: ^1.8.0
  flutter_speech: ^2.0.0
  convex_bottom_bar: ^3.2.0
  curved_navigation_bar: ^1.0.6

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.9.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/1024.png"
  adaptive_icon_background: "assets/images/1024.png"
  adaptive_icon_foreground: "assets/images/1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/


  fonts:
    - family: OpenSans
      fonts:
        - asset: fonts/OpenSans-Regular.ttf
          weight: 100
        - asset: fonts/OpenSans-Bold.ttf
          weight: 200
        - asset: fonts/OpenSans-ExtraBold.ttf
          weight: 700
        - asset: fonts/OpenSans-Light.ttf
          weight: 300
        - asset: fonts/OpenSans-SemiBold.ttf
          weight: 600
